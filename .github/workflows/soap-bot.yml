name: soap-bot

# 毎日 07:00 JST (= 22:00 UTC 前日) に「今日の泡」を Bluesky へ投稿する。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post today's bubble
        env:
          BLUESKY_HANDLE: sekken-fukaxa.bsky.social
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python3 soap_bot.py
